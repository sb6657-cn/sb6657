    <style>
        #global-loading {
            position: fixed;
            height: 100%;
            width: 100%;
            z-index: 9999;
            background-color: #fff;
            transition: opacity 0.5s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #global-loading.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-img {
            width: 200px;
        }

        .loading-spin {
            animation: loading-spin 8s linear infinite;
        }

        @keyframes loading-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: xx-large;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            100% {
                content: '';
            }

            25% {
                content: '.';
            }

            50% {
                content: '..';
            }

            75% {
                content: '...';
            }
        }
    </style>
